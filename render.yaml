# Render Blueprint for DIY Wikipedia: the Next.js web service and the FastAPI API service.
# Spec: https://render.com/docs/blueprint-spec  (checked 2026-10-31)
# Stack: Next.js (App Router) on Node 20 (commands match package.json scripts);
#        FastAPI on Python 3.12 managed by uv (api/pyproject.toml, api/uv.lock).
services:
  - type: web
    name: diy-wikipedia
    runtime: node            # native runtime, per spec "runtime" field
    plan: free               # change if the free plan's spin-down hurts the demo
    buildCommand: npm ci && npm run build        # npm ci installs exactly what package-lock.json pins
    startCommand: npm start                      # next start -H 0.0.0.0, reads $PORT
    healthCheckPath: /healthz                    # served by app/healthz/route.ts
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"                              # matches package.json engines.node
      - key: PAYPAL_ENV
        value: sandbox
      # The API service URL. Next inlines NEXT_PUBLIC_* at BUILD time, so a change
      # needs a rebuild. Unset = fixture mode (lib/api/client.ts).
      - key: NEXT_PUBLIC_API_URL
        value: https://diy-wikipedia-api.onrender.com
      # Secrets: sync:false means Render prompts for the value on first Blueprint
      # creation only; later changes are made in the dashboard (see spec).
      # No PAYPAL_CLIENT_SECRET here: the browser gets the client id from the API's
      # GET /checkout/config, and only the API service talks to PayPal with the secret.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: AG_GRID_LICENSE_KEY
        sync: false

  # API service (issue #1). Checked against the spec 2026-11-01.
  # No rootDir on purpose: "Files outside your service's root directory are not available to the
  # service at build time or at runtime" (https://render.com/docs/monorepo-support), and the API
  # reads contract/fixtures/ at startup. buildFilter gives the same "only redeploy when my files
  # change" behaviour rootDir would (paths are relative to the repo root, per the spec).
  # Because the service root is the repo root, Render does not auto-add uv (it does that only when
  # uv.lock is in the root dir, https://render.com/docs/uv-version), so the build installs a pinned uv.
  - type: web
    name: diy-wikipedia-api
    runtime: python
    plan: free
    buildCommand: pip install uv==0.12.24 && cd api && uv sync --locked --no-dev
    startCommand: cd api && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz                    # served by api/app/main.py
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - api/**
        - contract/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"                         # fully qualified, per https://render.com/docs/python-version
      - key: PAYPAL_ENV
        value: sandbox
      # Comma-separated browser origins allowed to call the API: the deployed web service URL.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
