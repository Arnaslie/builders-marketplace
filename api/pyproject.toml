[project]
name = "diy-wikipedia-api"
version = "0.1.0"
description = "FastAPI backend for DIY Wikipedia: projects, shopping agent cart, PayPal checkout."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    # PayPal REST calls (app/paypal.py). Also what FastAPI's TestClient uses in tests.
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# This is an application, not a library: uv installs only the dependencies, not the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
